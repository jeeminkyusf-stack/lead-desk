<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://cdn.jsdelivr.net; font-src https://cdn.jsdelivr.net; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; connect-src https://bberccestktirszcghlj.supabase.co; form-action 'none'; base-uri 'none'">
<meta name="robots" content="noindex">
<title>Sales Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1d5fc4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sales Hub">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f4f6f9;--panel:#fff;--line:#dfe4ec;--line2:#eef1f6;
  --ink:#1b2738;--sub:#5d6b80;--faint:#8a96a8;
  --blue:#1d5fc4;--blue-d:#123f87;--blue-m:#4a86de;--blue-l:#e8f0fc;--blue-l2:#f4f8fe;
  --font:"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--font);letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.shell{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100%}
.rail{background:var(--panel);border-right:1px solid var(--line);padding:18px 0;position:sticky;top:0;height:100vh}
.brand{font-size:16px;font-weight:700;padding:0 20px 18px;color:var(--blue-d)}
.nav{display:flex;justify-content:space-between;width:100%;padding:10px 20px 10px 17px;border:0;border-left:3px solid transparent;background:none;cursor:pointer;text-align:left;color:var(--sub);font-weight:500}
.nav:hover{background:var(--blue-l2)}
.nav[aria-current="page"]{border-left-color:var(--blue);background:var(--blue-l);color:var(--blue-d);font-weight:700}
main{padding:24px 28px 56px;min-width:0;max-width:1320px;display:flex;flex-direction:column;gap:14px}
h1{font-size:20px;font-weight:700;margin:0}
h2{font-size:14px;font-weight:700;margin:0}
.head{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.btn{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:4px;background:var(--panel);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-d);border-color:var(--blue-d);color:#fff}
.btn.sm{height:26px;padding:0 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--sub);cursor:pointer;font-size:13px}
.link:hover{color:var(--blue)}
.note{font-size:12px;color:var(--faint);margin:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tabs{display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid var(--line)}
.tab{padding:9px 16px;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;cursor:pointer;color:var(--sub);font-weight:500}
.tab b{font-weight:600;margin-left:4px;color:var(--faint)}
.tab[aria-selected="true"]{color:var(--blue-d);border-bottom-color:var(--blue);font-weight:700}
.tab[aria-selected="true"] b{color:var(--blue)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:3px;font-size:12px;font-weight:600;white-space:nowrap}
.t-특송{background:var(--blue-d);color:#fff}.t-풀필먼트{background:var(--blue-m);color:#fff}.t-포워딩{background:var(--blue-l);color:var(--blue-d)}
.t-none{background:var(--line2);color:var(--sub)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.table{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tr{display:grid;grid-template-columns:minmax(0,1.3fr) 200px 110px minmax(0,1.5fr) 84px 72px 20px;gap:12px;align-items:center;padding:11px 16px;width:100%;border:0;background:none;text-align:left}
.th{font-size:12px;font-weight:600;color:var(--sub);background:var(--blue-l2);border-bottom:1px solid var(--line);padding-block:8px}
.row{border-bottom:1px solid var(--line2)}.row:last-child{border-bottom:0}
button.tr{cursor:pointer}button.tr:hover{background:var(--blue-l2)}
.row.open>button.tr{background:var(--blue-l)}
.co{font-weight:600;overflow-wrap:anywhere}
.co small{display:block;font-weight:400;font-size:12px;color:var(--faint)}
.clip{color:var(--sub);font-size:13px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lanes{font-size:12px;color:var(--sub)}
.due{font-weight:600;font-size:13px}.due.over{color:var(--blue-d);font-weight:800}.due.none{color:var(--faint);font-weight:400}
.chev{color:var(--faint);transition:transform .15s}.row.open .chev{transform:rotate(180deg);color:var(--blue)}
.drop{padding:16px;background:var(--blue-l2);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.ctl{display:grid;grid-template-columns:auto 130px 150px minmax(0,1fr);gap:10px;align-items:end}
.ctl label,.lb{display:block;font-size:12px;color:var(--sub);margin-bottom:3px}
input,select,textarea{width:100%;height:32px;padding:0 8px;background:#fff;border:1px solid var(--line);border-radius:4px;min-width:0}
textarea{height:auto;min-height:72px;padding:6px 8px;resize:vertical;display:block}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:0}
.tog{height:32px;padding:0 12px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:500;color:var(--sub)}
.tog+.tog{margin-left:-1px}
.tog:first-child{border-radius:4px 0 0 4px}.tog:last-child{border-radius:0 4px 4px 0}
.tog[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff;position:relative}
.seg{display:inline-flex}
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.box{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.box>h3{margin:0;font-size:13px;display:flex;align-items:center;gap:6px}
.req{display:flex;flex-direction:column;gap:4px;padding-top:8px;border-top:1px solid var(--line2)}
.req p{margin:0;overflow-wrap:anywhere}
.req .bar{display:flex;gap:6px;align-items:center}
.req select{width:auto;flex:none;height:26px;font-size:12px;padding:0 22px 0 6px}
.req input{height:26px;font-size:12px}
.mini{display:inline-flex;margin-left:auto}
.mini button{height:22px;width:24px;border:1px solid var(--line);background:#fff;font-size:11px;cursor:pointer;color:var(--faint);padding:0}
.mini button+button{margin-left:-1px}
.mini button[aria-pressed="true"]{background:var(--blue-l);color:var(--blue-d);font-weight:700}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sum3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:stretch}
.sum3 .lb{margin:4px 0 3px}.sum3 .prog{font-size:12px;color:var(--sub);margin:2px 0 0}
.chk{display:grid;grid-template-columns:18px minmax(0,1fr);gap:6px 8px;align-items:start;padding-top:8px;border-top:1px solid var(--line2)}
.chk input[type=checkbox]{width:16px;height:16px;margin:2px 0 0}
.chk.done span{color:var(--faint);text-decoration:line-through}
.chk input.ans{grid-column:2;height:26px;font-size:12px}
dl{display:grid;grid-template-columns:72px minmax(0,1fr);gap:3px 8px;margin:0}
dt{color:var(--sub);font-size:13px}dd{margin:0;overflow-wrap:anywhere}
.acts{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.entry{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.entry textarea{min-height:300px}
.empty{padding:40px 16px;text-align:center;color:var(--sub)}
.notice{background:var(--blue-l);color:var(--blue-d);padding:8px 12px;border-radius:4px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;font-size:13px}
.detail{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:start}
.sec{font-size:12px;font-weight:700;color:var(--blue-d);padding-bottom:5px;border-bottom:1px solid var(--line);margin-top:6px}
.f{display:grid;grid-template-columns:140px minmax(0,1fr) 48px;gap:8px;align-items:start;margin-top:6px}
.f label{padding-top:6px;font-size:13px;color:var(--sub)}.f label i{color:var(--blue);font-style:normal}
.f.done .btn{background:var(--blue-l);border-color:var(--blue-l);color:var(--blue-d)}
.hints{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.preview{background:var(--blue-l2);border:1px solid var(--line);border-radius:4px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere;min-height:36px}
.fu{padding-top:8px;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:4px}
.fu p{margin:0;overflow-wrap:anywhere}
.fu .bar{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--sub)}.fu .bar span:first-child{margin-right:auto}
.form2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.form2 .wide{grid-column:1/-1}
.login{max-width:360px;margin:64px auto 0;width:100%}
.login form{display:flex;flex-direction:column;gap:10px}
.login .err{color:var(--blue-d);font-weight:600;font-size:13px;margin:0}
.status{padding:14px 20px 0;font-size:12px;color:var(--faint);margin:0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--blue-d);color:#fff;padding:7px 14px;border-radius:4px;z-index:20}
@media (max-width:1100px){.tr{grid-template-columns:minmax(0,1fr) 180px 70px 20px}.tr>.c-lane,.tr>.c-req,.tr>.c-stage{display:none}.detail,.entry{grid-template-columns:minmax(0,1fr)}}
.btn[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.mday{font-size:13px;font-weight:700;color:var(--blue-d);margin:8px 0 -6px}
.mrow{display:grid;grid-template-columns:56px minmax(0,1fr) 20px;gap:12px;align-items:center;padding:13px 16px;width:100%;border:0;background:none;text-align:left;cursor:pointer}
.mrow:hover{background:var(--blue-l2)}
.row.open>.mrow{background:var(--blue-l)}
.mtime{font-size:16px;font-weight:700;color:var(--blue-d)}
.memo{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.col{min-width:0}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;min-height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;background:var(--panel);border-bottom:1px solid var(--line)}
.menu-btn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:4px;background:none;color:var(--blue-d);cursor:pointer;padding:0}
.menu-btn:hover{background:var(--blue-l)}
.top-title{display:none;font-size:16px;font-weight:700;color:var(--blue-d)}
#scrim{display:none}
@media (min-width:721px){body.rail-off .shell{grid-template-columns:minmax(0,1fr)}body.rail-off .rail{display:none}body.rail-off .top-title{display:block}}
.mlab{font-size:12px;font-weight:600;color:var(--sub)}
.calwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
.caldays{display:flex;flex-direction:column;gap:14px;min-width:0}
.caldays .mday{margin:0 0 -6px}
.calh{display:flex;align-items:center;gap:6px}
.calh h2{font-size:15px;margin-right:auto}
.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line2);border-left:1px solid var(--line2)}
.cw{font-size:12px;color:var(--sub);text-align:center;padding:5px 0;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);background:var(--blue-l2)}
.cd{min-height:96px;min-width:0;padding:5px;border:0;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);background:#fff;text-align:left;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.cd:hover{background:var(--blue-l2)}
.cd.out{background:var(--bg)}.cd.out .cn{color:var(--faint)}
.cd[aria-pressed="true"]{background:var(--blue-l);box-shadow:inset 0 0 0 1px var(--blue)}
.cn{font-size:12px;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;flex:none}
.cd.today .cn{background:var(--blue);color:#fff;font-weight:700}
.ce{font-size:11px;line-height:16px;padding:0 4px;border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ce.m{background:var(--blue-l);color:var(--blue-d);font-weight:600}
.cd[aria-pressed="true"] .ce.m{background:#fff}
.ce.f{background:var(--line2);color:var(--sub)}
.cmore{font-size:11px;color:var(--faint);padding:0 4px}
.cdots{display:none;gap:3px;justify-content:center}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.dot.m{background:var(--blue)}.dot.f{background:var(--faint)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--sub)}.legend span{display:inline-flex;align-items:center;gap:4px}
@media (min-width:1101px){.calwrap{grid-template-columns:minmax(0,1fr) 340px}}
.ib{display:inline-block;font-size:11px;font-weight:600;color:var(--sub);background:var(--line2);border-radius:3px;padding:0 6px;margin-right:4px;line-height:18px}
.ib.자체{background:var(--blue-l);color:var(--blue-d)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mx{display:grid;grid-template-columns:150px 140px minmax(0,1fr) minmax(0,1fr) 32px;gap:8px;align-items:center}
.mx.h{font-size:12px;color:var(--sub)}
.mx .x{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer;color:var(--faint)}
.mx .x:hover{color:var(--blue);border-color:var(--blue)}
.ev{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line2)}
.ev:first-of-type{border-top:0}
.evk{font-size:12px;font-weight:700;color:var(--sub);display:flex;flex-direction:column;gap:2px}
.evk small{font-weight:400;color:var(--faint)}
.evk.q{color:var(--blue-d)}.evk.m{color:var(--blue)}
.ev .bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ev p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.ev select{width:auto;height:26px;font-size:12px;padding:0 22px 0 6px}
.ev.h p{margin:0;color:var(--sub);font-size:13px}
.files{display:flex;flex-wrap:wrap;gap:6px}
.file{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.ov{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.ov .form2 label{display:block}
@media (max-width:720px){
.shell{display:block}
.rail{position:fixed;left:0;top:0;bottom:0;height:auto;width:240px;z-index:30;overflow-y:auto;padding:calc(18px + env(safe-area-inset-top)) 0 calc(18px + env(safe-area-inset-bottom));transform:translateX(-100%);visibility:hidden;transition:transform .18s,visibility .18s}
body.rail-open .rail{transform:none;visibility:visible}
body.rail-open #scrim{display:block;position:fixed;inset:0;z-index:25;background:rgba(27,39,56,.4)}
.nav{padding:14px 20px 14px 17px;font-size:15px}
.top-title{display:block}
main{padding:16px 16px calc(32px + env(safe-area-inset-bottom))}
input,select,textarea{font-size:16px;height:42px}
textarea{height:auto}
input[type=checkbox]{height:16px}
.btn{height:40px;padding:0 14px}.btn.sm{height:34px;padding:0 10px}.tog{height:40px}
.tabs{flex-wrap:nowrap;overflow-x:auto}.tab{white-space:nowrap}
.tr{grid-template-columns:minmax(0,1fr) 60px 20px}.tr>.c-tag{grid-row:2;grid-column:1/-1}.th{display:none}
.mx{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.mx.h{display:none}.mx .x{width:100%;height:36px}.mx{padding-bottom:10px;border-bottom:1px solid var(--line2)}
.ev{grid-template-columns:minmax(0,1fr)}.evk{flex-direction:row;gap:6px}
.ov{grid-template-columns:minmax(0,1fr)}
.ev select{height:34px}
.ctl,.two,.sum3{grid-template-columns:minmax(0,1fr)}
.req .bar{flex-wrap:wrap}.req select{width:auto;height:36px}.req input{height:36px;font-size:16px;flex:1 1 140px}.chk input.ans{height:36px;font-size:16px}
.mini button{height:32px;width:34px}
.f{grid-template-columns:minmax(0,1fr) 52px}.f label{grid-column:1/-1;padding:0}
.acts{flex-wrap:wrap}
.login{margin-top:32px}
.panel.cal{padding:12px 8px}
.cd{min-height:54px;align-items:center;padding:4px 0}
.ce,.cmore{display:none}
.cdots{display:flex}
#toast{bottom:calc(24px + env(safe-area-inset-bottom));max-width:calc(100% - 32px)}
}
</style>
</head>
<body>
<div class="shell"><nav class="rail" id="rail" aria-label="메뉴"></nav><div class="col"><header class="top"><button class="menu-btn" id="menu-btn" data-act="menu" aria-label="메뉴 열기·닫기"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button><span class="top-title">Sales Hub</span></header><main id="view"></main></div></div>
<div id="scrim" data-act="menu-close"></div>
<div id="toast" hidden></div>
<script>
'use strict';
const SERVICES=['특송','풀필먼트','포워딩'];
const SVC_RULE={
  '특송':/특송|택배|직배송|B2C|라스트\s*마일|소비자\s*배송|개별\s*(주문|배송)|국제\s*배송|크로스보더/i,
  '풀필먼트':/풀필먼트|3PL|창고|보관|입고|재고|현지\s*분류|주문별\s*분류|송장\s*부착|배송대행지|합배송|합포장/i,
  '포워딩':/포워딩|해상|항공\s*(운송|화물)|컨테이너|FCL|LCL|벌크|B2B|수출입\s*운송/i
};
const classify=t=>SERVICES.filter(s=>SVC_RULE[s].test(t||''));
const CRM_SVC={'특송':['택배 (전자상거래)','택배 (표준)'],'풀필먼트':['물류배송 (3PL)','공급망 창고배송'],'포워딩':['화물운송대리 (항공사)','화물운송 (해운)']};
const OPT={
  channel:['SELF','WA','BA','CS','MKT','MKT-PJT','MKT-AI'],scale:['중소기업','중견기업','대기업'],
  biz:['뷰티','패션','식품•건강','전자•IT','공업•제조','반도체•하이테크산업','생활•소비재','이커머스•유통','물류•서비스'],
  rev:['10억 미만','10억~50억','50억~100억','100억~500억','500억~1000억','1000억 이상'],

  if(!sess){V.name='login';render();return;}
  V.name='loading';render();
  try{await loadServer();V.name=landing();}
  catch(e){if(e.status===401||e.status===400){setSess(null);V.name='login';V.loginErr='다시 로그인해 주세요.';}else{V.name=landing();syncErr=true;}}
  render();
  refreshPush();
}

/* 견적 파일: 비공개 버킷 quotes에 저장하고, 열 때만 5분짜리 서명 링크를 받는다 */
async function stor(path,opt){
  const t=await token();
  const r=await fetch(SB_URL+'/storage/v1/'+path,Object.assign({},opt,{headers:Object.assign({apikey:SB_KEY,Authorization:'Bearer '+t},opt.headers||{})}));
  if(!r.ok){const e=new Error('storage');e.status=r.status;throw e;}
  return r.json().catch(()=>null);
}
const upload=(path,file)=>stor('object/quotes/'+path,{method:'POST',headers:{'Content-Type':file.type||'application/octet-stream','x-upsert':'false'},body:file});
const removeFiles=paths=>paths.length?stor('object/quotes',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({prefixes:paths})}):Promise.resolve();
async function openFile(path){
  const w=window.open('','_blank');
  try{const j=await stor('object/sign/quotes/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expiresIn:300})});const u=SB_URL+'/storage/v1'+j.signedURL;if(w)w.location.href=u;else location.href=u;}
  catch(e){if(w)w.close();toast('파일을 열지 못했습니다.');}
}
async function saveQuote(l){
  const f=V.qForm,files=V.qFiles||[];
  if(l.example){toast('예시 업체에는 견적을 등록할 수 없습니다.');return;}
  if(!f.date){toast('발송일을 입력해 주세요.');return;}
  if(!files.length&&!f.note.trim()){toast('견적 파일을 첨부하거나 메모를 입력해 주세요.');return;}
  if(files.some(x=>x.size>MAX_FILE)){toast('20MB를 넘는 파일은 올릴 수 없습니다.');return;}
  const q={id:'Q'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),round:+f.round||l.quotes.length+1,date:f.date,svc:f.svc.slice(),status:f.status,note:f.note.trim(),files:[]};
  V.qBusy=true;render();
  try{
    for(const [n,x] of files.entries()){
      const ext=(x.name.includes('.')?x.name.split('.').pop():'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5)||'bin';
      const path=l.id+'/'+q.id+'-'+n+'.'+ext;
      await upload(path,x);q.files.push({path,name:x.name,size:x.size});
    }
    l.quotes.push(q);V.qForm=null;V.qFiles=[];V.actForm=null;persist();toast('견적을 저장했습니다.');
  }catch(e){removeFiles(q.files.map(x=>x.path)).catch(()=>{});toast(e.status===413?'파일이 너무 큽니다.':'파일을 올리지 못했습니다. 다시 시도해 주세요.');}
  V.qBusy=false;render();
}

const FN=SB_URL+'/functions/v1/push';
const PUSH={state:'checking',busy:false};
function swReady(){return Promise.race([navigator.serviceWorker.ready,new Promise((_,x)=>setTimeout(()=>x(new Error('sw')),4000))]);}
function pushHtml(){
  const p=PUSH.state,d=PUSH.busy?'disabled':'';
  if(p==='checking')return '';
  if(p==='install')return '<div class="notice">알림을 받으려면 Safari 공유 버튼에서 「홈 화면에 추가」 후, 홈 화면의 Sales Hub 아이콘으로 실행해 주세요.</div>';
  if(p==='unsupported')return '<div class="notice">이 브라우저는 푸시 알림을 지원하지 않습니다.</div>';
  if(p==='denied')return '<div class="notice">이 기기에서 알림이 차단되어 있습니다. 휴대폰 설정의 알림 항목에서 Sales Hub를 허용해 주세요.</div>';
  if(p==='on')return `<div class="notice"><span>이 기기로 미팅 알림을 받습니다.</span><span class="acts"><button class="btn sm" data-act="p-test" ${d}>테스트 알림</button><button class="btn sm" data-act="p-off" ${d}>끄기</button></span></div>`;
  return `<div class="notice"><span>이 기기의 알림이 꺼져 있습니다.</span><button class="btn sm primary" data-act="p-on" ${d}>알림 켜기</button></div>`;
}
function paintPush(){const e=$('push-box');if(e)e.innerHTML=pushHtml();}
async function saveSub(sub){const j=sub.toJSON();await rest('push_subscriptions',{method:'POST',headers:UPSERT,body:JSON.stringify([{endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,device:navigator.userAgent.slice(0,120)}])});}
async function refreshPush(){
  const std=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true,ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window))PUSH.state=ios&&!std?'install':'unsupported';
  else if(Notification.permission==='denied')PUSH.state='denied';
  else try{const sub=await (await swReady()).pushManager.getSubscription();PUSH.state=sub?'on':'off';if(sub&&sess)saveSub(sub).catch(()=>{});}catch(e){PUSH.state='unsupported';}
  paintPush();
}
function b64bytes(s){const b=atob(s.replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0));}
async function pushOn(){
  PUSH.busy=true;paintPush();
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){PUSH.state=perm==='denied'?'denied':'off';return;}
    const r=await fetch(FN);if(!r.ok)throw new Error('key');
    const key=(await r.json()).publicKey;
    const reg=await swReady();
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64bytes(key)});
    await saveSub(sub);PUSH.state='on';toast('알림을 켰습니다. 테스트 알림으로 확인해 주세요.');
  }catch(e){toast('알림을 켜지 못했습니다.');}
  finally{PUSH.busy=false;paintPush();}
}
async function pushOff(){
  PUSH.busy=true;paintPush();
  try{const sub=await (await swReady()).pushManager.getSubscription();if(sub){await rest('push_subscriptions?endpoint=eq.'+encodeURIComponent(sub.endpoint),{method:'DELETE',headers:{Prefer:'return=minimal'}});await sub.unsubscribe();}PUSH.state='off';toast('알림을 껐습니다.');}
  catch(e){toast('알림을 끄지 못했습니다.');}
  finally{PUSH.busy=false;paintPush();}
}
async function pushTest(){
  PUSH.busy=true;paintPush();
  try{
    const t=await token();
    const r=await fetch(FN,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+t,'Content-Type':'application/json'},body:'{"test":true}'});
    if(!r.ok)throw new Error('fn');
    const a=(await r.json()).results||[],ok=a.filter(s=>s>=200&&s<300).length;

    case 'act-fu':V.actForm=V.actForm==='fu'?null:'fu';render();break;
    case 'act-close':V.actForm=null;V.qForm=null;V.qFiles=[];render();break;
    case 'q-svc':{const s=b.dataset.s,f=V.qForm;f.svc=f.svc.includes(s)?f.svc.filter(x=>x!==s):Q_SVC.filter(x=>f.svc.includes(x)||x===s);render();break;}
    case 'q-st':V.qForm.status=b.dataset.s;render();break;
    case 'q-save':if(!V.qBusy)await saveQuote(l);break;
    case 'q-file':{const q=l.quotes.find(x=>x.id===b.dataset.id),x=q&&q.files[+b.dataset.n];if(x)openFile(x.path);break;}
    case 'q-del':{const id=b.dataset.id;if(V.armed==='q-del:'+id){const q=l.quotes.find(x=>x.id===id);V.armed=null;try{await removeFiles(q.files.map(x=>x.path));}catch(e){toast('파일을 지우지 못했습니다. 다시 시도해 주세요.');render();break;}l.quotes=l.quotes.filter(x=>x.id!==id);persist();toast('견적을 삭제했습니다.');}else V.armed='q-del:'+id;render();break;}
    case 'svc':{const s=b.dataset.s;l.services=l.services.includes(s)?l.services.filter(x=>x!==s):SERVICES.filter(x=>l.services.includes(x)||x===s);persist();render();break;}
    case 'req-cat':{const r=l.requests[i],s=b.dataset.s;r.cats=r.cats.includes(s)?r.cats.filter(x=>x!==s):SERVICES.filter(x=>r.cats.includes(x)||x===s);persist();render();break;}
    case 'req-copy':copyText(l.requests.map((r,n)=>(n+1)+'. '+r.text+'\n→ '+r.status+(r.answer?': '+r.answer:'')).join('\n'));break;
    case 'del':if(V.armed==='del'){const paths=(l.quotes||[]).flatMap(q=>q.files.map(x=>x.path));if(paths.length)removeFiles(paths).catch(()=>{});S.meetings.forEach(m=>{if(m.lead_id===l.id)m.lead_id=null;});S.leads=S.leads.filter(x=>x.id!==l.id);V.armed=null;V.open=null;persist();}else V.armed='del';render();break;
    case 'biz':l.crm.bizarea=b.dataset.v;dirty(l);persist();render();break;
    case 'hint':l.crm[b.dataset.k]=b.dataset.v;$('f-'+b.dataset.k).value=b.dataset.v;dirty(l);save();break;
    case 'copy-f':if(await copyText(l.crm[b.dataset.k])){(copied[l.id]=copied[l.id]||{})[b.dataset.k]=1;$('row-'+b.dataset.k).classList.add('done');b.textContent='완료';}break;
    case 'reset-copy':delete copied[l.id];render();break;
    case 'synced':l.crmSynced=true;l.followups.forEach(f=>f.synced=true);persist();render();toast('팀 CRM 반영 완료로 표시했습니다.');break;
    case 'fu-add':if(!V.fuBody.trim()&&!V.fuAct.trim()){toast('내용을 입력하세요.');break;}l.followups.unshift({type:V.fuType,date:V.fuDate,text:fuText(),synced:false});V.fuBody='';persist();render();toast('기록을 추가했습니다.');break;
    case 'fu-copy':copyText(fuText());break;
    case 'fu-copy-i':copyText(l.followups[i].text);break;
    case 'fu-sync':l.followups[i].synced=!l.followups[i].synced;persist();render();break;
    case 'fu-del':l.followups.splice(i,1);persist();render();break;
    case 'backup':backup();break;
    case 'logout':setSess(null);try{localStorage.removeItem(KEY);}catch(e){}location.reload();break;
    case 'restore-ok':S=V.restore;S.owner=S.owner||'';S.meetings=S.meetings||[];S.leads.forEach(norm);V.restore=null;persist();render();toast('복원했습니다.');break;
    case 'restore-no':V.restore=null;render();break;
  }
});
const FU_ACT={이메일:'메일 발송',전화:'유선 통화',미팅:'미팅 진행',기타:''};
document.addEventListener('input',e=>{
  const t=e.target,d=t.dataset;
  if(d.m){V.mForm[d.m]=t.value;return;}
  if(d.dr){V.dr[d.dr]=t.value;return;}
  if(d.q){V.qForm[d.q]=t.value;return;}
  if(d.mx&&t.tagName!=='SELECT'){const l=leadOf();if(l&&l.mix[+d.i]){l.mix[+d.i][d.mx]=t.value;save();}return;}
  if(t.id==='draft'){V.draft=t.value;$('pv').innerHTML=previewHtml();return;}
  if(d.v2){S[d.v2]=t.value;save();return;}
  if(d.v){V[d.v]=t.value;if(d.v==='fuType'){V.fuAct=FU_ACT[t.value]||'';$('fu-act').value=V.fuAct;}const p=$('fu-pv');if(p)p.textContent=fuText();return;}
  const l=leadOf();if(!l)return;
  if(d.f){l.crm[d.f]=t.value;dirty(l);save();return;}
  if(d.l){if(t.type==='checkbox')return;l[d.l][+d.i][d.k]=t.value;save();}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='restore-file'){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.leads))throw 0;V.restore=o;render();}catch(x){toast('Sales Hub 백업 파일이 아닙니다.');}};r.readAsText(f);return;}
  if(t.type==='checkbox'&&t.dataset.l){const l=leadOf();l[t.dataset.l][+t.dataset.i][t.dataset.k]=t.checked;persist();render();return;}
  if(t.id==='q-files'){V.qFiles=[...t.files];render();return;}
  if(t.dataset.qs){const l=leadOf(),q=l&&l.quotes.find(x=>x.id===t.dataset.qs);if(q&&q.status!==t.value){l.history.push({at:new Date().toISOString(),text:q.round+'차 견적 상태: '+q.status+' → '+t.value});q.status=t.value;persist();render();}return;}
  if(t.dataset.mx==='type'){const l=leadOf();if(l&&l.mix[+t.dataset.i]){l.mix[+t.dataset.i].type=t.value;persist();render();}return;}
  if(t.dataset.f==='stage'||t.dataset.f==='salestatus'){const l=leadOf();if(l){track(l);persist();render();}return;}
  if(t.dataset.f==='nextDate'){persist();if(V.name==='home')render();}
});
try{if(localStorage.getItem('sales-hub-rail')==='1')document.body.classList.add('rail-off');}catch(e){}
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('rail-open');});
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState!=='visible'||!sess||!loaded||S.pendingSync||V.mForm||V.entry||!['home','meetings'].includes(V.name))return;
  try{await loadServer();render();}catch(e){}
});
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
boot();
</script>
</body>
</html>
